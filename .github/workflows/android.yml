name: 安卓三模型构建

on:
  push:
    branches: [agent/update-voice-recognition]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 配置 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 检查资源清单与打包脚本
        run: |
          python -B -m unittest discover -s android-app/scripts/tests -v
          node --check android-app/app/src/main/assets/web/app.js
          node --check android-app/app/src/main/assets/web/theme.js
      - name: 运行安卓单元测试
        run: gradle --no-daemon -p android-app testDebugUnitTest
      - name: 运行安卓代码检查
        run: gradle --no-daemon -p android-app lintDebug
      - name: 下载已上传的三个模型
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android-app/local-resources/github-model-assets
          READY=0
          for ATTEMPT in $(seq 1 80); do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/voice-bundled-models-v1" --jq '.assets[].name' | grep -qx bundled-models.json; then
              READY=1
              break
            fi
            echo "模型仍在上传，等待资源清单就绪（$ATTEMPT/80）"
            sleep 30
          done
          test "$READY" = 1
          gh release download voice-bundled-models-v1 --repo "$GITHUB_REPOSITORY" --dir android-app/local-resources/github-model-assets
      - name: 校验并准备内置模型
        run: python -B android-app/scripts/bundle_models.py --stage --release-dir android-app/local-resources/github-model-assets
      - name: 准备固定开发签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing.jks"
          test -s "$RUNNER_TEMP/android-signing.jks"
      - name: 构建自带三模型安装包
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -p android-app -PbundledModels=true assembleDebug
      - name: 核验 APK 内三个模型
        run: python -B android-app/scripts/bundle_models.py --verify-apk android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: 核验签名版本并准备交付文件
        id: delivery
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          VERSION="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android-app/app/build.gradle.kts)"
          NAME="语点-${VERSION}-Android-arm64-三模型开发版"
          mkdir -p android-app/发布
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "android-app/发布/${NAME}-校验.txt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          head -n 3 "$RUNNER_TEMP/apk-badging.txt" >> "android-app/发布/${NAME}-校验.txt"
          cp "$APK" "android-app/发布/${NAME}.apk"
          sha256sum "android-app/发布/${NAME}.apk" >> "android-app/发布/${NAME}-校验.txt"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: 保存安装包到 GitHub 资源页
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload voice-bundled-models-v1 android-app/发布/* --repo "$GITHUB_REPOSITORY" --clobber
