name: 安卓构建

on:
  push:
    branches:
      - agent/update-voice-recognition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 配置 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 测试、检查并构建 APK
        run: gradle --no-daemon -p android-app testDebugUnitTest lintDebug assembleDebug
      - name: 保存安卓安装包
        uses: actions/upload-artifact@v4
        with:
          name: 安卓语音输入-中英实时识别版
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
