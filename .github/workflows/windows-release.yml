name: Windows 编译

on:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号
        required: true
        default: v0.16.0

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.15.0

      - name: 运行测试
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: 编译语点
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "语点" `
            --add-data "web;web" `
            --add-data "assets;assets" `
            --collect-all webview `
            --collect-all sherpa_onnx `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all transcribe_cpp `
            app.py

      - name: 创建独立模型文件夹
        shell: pwsh
        run: |
          $modelDir = Join-Path $PWD "dist\语点\models"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          @"
          此文件夹用于单独存放语音识别模型，模型不会编译进语点.exe。
          也可以设置 VOICE_INPUT_MODEL_REPOSITORY，让程序读取其他模型仓库。
          "@ | Set-Content -Encoding UTF8 (Join-Path $modelDir "模型放置说明.txt")

      - name: 删除未使用的内置 VAD 模型
        shell: pwsh
        run: |
          $vadModel = "dist\语点\_internal\faster_whisper\assets\silero_vad_v6.onnx"
          if (Test-Path -LiteralPath $vadModel) {
            Remove-Item -LiteralPath $vadModel -Force
          }

      - name: 检查发布包不含模型
        shell: pwsh
        run: |
          $modelExtensions = @(".onnx", ".ort", ".gguf", ".safetensors", ".pt", ".pth", ".ckpt")
          $forbidden = Get-ChildItem -LiteralPath "dist\语点" -Recurse -File | Where-Object {
            $modelExtensions -contains $_.Extension.ToLowerInvariant() -or
            ($_.Extension -eq ".bin" -and $_.Name -match "^(encoder|decoder|joiner|model|tokens)\.bin$")
          }
          if ($forbidden) {
            $forbidden.FullName
            throw "发布包中发现模型文件，已停止发布。"
          }

      - name: 生成压缩包和校验值
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $zipName = "Yudian-Windows-$version.zip"
          Compress-Archive -Path "dist\语点" -DestinationPath $zipName -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLowerInvariant() | Set-Content -Encoding ASCII "$zipName.sha256"
          "RELEASE_ZIP=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 发布 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.version }}"
          $notesFile = "release-notes.md"
          @"
          ## 语点 $version

          - 支持 Streaming Paraformer 与 Zipformer 实时显示文字。
          - 支持 Faster-Whisper Small、Qwen3-ASR 0.6B INT8 与 Qwen3-ASR 1.7B Q5_K_M 整段识别。
          - 移除识别后通用文字校正，保留模型原始输出。
          - 模型不进入 EXE 或 ZIP，统一放在程序旁的独立 models 文件夹。
          - 压缩包附带 SHA-256 校验文件。
          "@ | Set-Content -Encoding UTF8 $notesFile
          gh release create $version `
            $env:RELEASE_ZIP `
            "$env:RELEASE_ZIP.sha256" `
            --target $env:GITHUB_SHA `
            --title "语点 $version" `
            --notes-file $notesFile
