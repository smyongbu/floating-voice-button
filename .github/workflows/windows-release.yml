name: Windows 三模型编译
on:
  workflow_dispatch:
  push:
    branches: [agent/windows-three-models]
    paths: ["**", "!android-app/**"]
permissions:
  contents: write
concurrency:
  group: windows-three-models
  cancel-in-progress: false
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.15.0
      - name: 运行测试
        run: python -m unittest discover -s tests -v
      - name: 下载并还原已上传的三模型
        run: python tools/windows_model_bundle.py build/cloud-models
      - name: 编译三模型版本
        shell: pwsh
        run: |
          $env:VOICE_INPUT_MODEL_REPOSITORY = Join-Path $PWD 'build/cloud-models'
          python tools/build_windows.py --variant first-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = python -c "from version import APP_VERSION; print(APP_VERSION)"
          $info = (Get-Item -LiteralPath 'dist/语点/语点.exe').VersionInfo
          if ($info.FileVersion -ne $expected -or $info.ProductVersion -ne $expected) { throw 'EXE版本不一致' }
      - name: 核验包内模型并生成附件
        run: python -m tools.prepare_windows_delivery
      - name: 上传版本化安装包
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload voice-bundled-models-v1 发布版本/github/* --repo "$env:GITHUB_REPOSITORY"
